<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BROKE CEO — Leaderboard Test</title>
<style>
:root{--bg:#050b0d;--panel:#0b1518;--panel2:#0e1a1d;--text:#f5f7f7;--muted:#8fa3a5;--teal:#18f0ce;--line:rgba(24,240,206,.18)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,rgba(24,240,206,.10),transparent 34%),#050b0d;color:var(--text);font-family:Inter,Arial,sans-serif}a{color:inherit;text-decoration:none}.wrap{max-width:1040px;margin:auto;padding:28px 22px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0 22px;border-bottom:1px solid var(--line)}.brand{font-size:23px;font-weight:900}.brand span{color:var(--teal)}.nav{display:flex;gap:9px;flex-wrap:wrap}.nav a{border:1px solid var(--line);padding:9px 12px;border-radius:10px;color:var(--muted);font-size:12px;font-weight:800}.nav a:hover{color:var(--teal);border-color:var(--teal)}.hero{text-align:center;padding:48px 0 28px}.kicker{color:var(--teal);font-size:11px;font-weight:900;letter-spacing:3px}.hero h1{font-size:clamp(42px,7vw,76px);letter-spacing:-3px;margin:10px 0}.hero p{color:var(--muted);margin:0}.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:20px 0}.pod{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;padding:20px;text-align:center}.pod .rank{font-size:12px;color:var(--teal);font-weight:900;letter-spacing:2px}.pod img{width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid var(--teal);margin:12px auto 8px;background:#0d191c}.pod h3{margin:4px 0;font-size:18px}.pod p{margin:0;color:var(--muted);font-size:12px}.pod b{display:block;margin-top:11px;font-size:24px}.table{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;overflow:hidden}.row{display:grid;grid-template-columns:70px 1fr 160px;gap:14px;align-items:center;padding:14px 18px;border-top:1px solid rgba(255,255,255,.06)}.row:first-child{border-top:0}.head{font-size:10px;letter-spacing:1.5px;font-weight:900;color:var(--muted)}.person{display:flex;align-items:center;gap:12px;min-width:0}.person img{width:42px;height:42px;border-radius:50%;object-fit:cover;background:#0d191c}.name{min-width:0}.name strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.name span{color:var(--muted);font-size:11px}.points{text-align:right;font-weight:900;color:var(--teal)}.status{text-align:center;color:var(--muted);font-size:12px;margin:16px 0}.footer{text-align:center;color:var(--muted);font-size:11px;margin-top:28px}@media(max-width:700px){.podium{grid-template-columns:1fr}.row{grid-template-columns:48px 1fr 90px;padding:12px}.pod{padding:16px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div class="brand">BROKE <span>LEADERBOARD</span></div>
  <nav class="nav">
    <a href="/store/board-test/">Missions</a>
    <a href="/profile-test/?wallet=TEST_WALLET_002">My Profile</a>
    <a href="/store-test/">Store</a>
  </nav>
</header>

<section class="hero">
  <div class="kicker">TOP 100 BROKE CEOs</div>
  <h1>WHO'S THE LEAST BROKE?</h1>
  <p>Ranked by BROKE POINTS. Connected X profiles only.</p>
</section>

<div class="status" id="status">Loading leaderboard…</div>
<section class="podium" id="podium"></section>
<section class="table" id="table"></section>
<div class="footer">BROKE CEO • PRIVATE LEADERBOARD TEST • TOP 100</div>
</div>
<script>
const API='https://broke-ceo-board.karim0ghilani.workers.dev/api';
const fallback='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#0d191c"/><circle cx="50" cy="38" r="18" fill="#18f0ce"/><path d="M18 92c3-25 18-36 32-36s29 11 32 36" fill="#18f0ce"/></svg>');
function avatar(u){return (u||fallback).replace('_normal','_400x400')}
async function load(){
  const status=document.getElementById('status');
  try{
    const r=await fetch(API+'/leaderboard');
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||'Leaderboard failed');
    const leaders=d.leaders||[];
    status.textContent=leaders.length+' connected profile'+(leaders.length===1?'':'s')+' ranked • Top 100 maximum';

    document.getElementById('podium').innerHTML=leaders.slice(0,3).map(x=>'<article class="pod"><div class="rank">#'+x.rank+'</div><img src="'+avatar(x.profile_image_url)+'" alt=""><h3>'+(x.display_name||x.username)+'</h3><p>@'+x.username+'</p><b>'+Number(x.points).toLocaleString()+' PTS</b></article>').join('');

    const table=document.getElementById('table');
    table.innerHTML='<div class="row head"><div>RANK</div><div>PROFILE</div><div style="text-align:right">POINTS</div></div>'+
      leaders.map(x=>'<div class="row"><div><strong>#'+x.rank+'</strong></div><div class="person"><img src="'+avatar(x.profile_image_url)+'" alt=""><div class="name"><strong>'+(x.display_name||x.username)+'</strong><span>@'+x.username+'</span></div></div><div class="points">'+Number(x.points).toLocaleString()+'</div></div>').join('');
  }catch(e){status.textContent=e.message}
}
load();
</script>
</body>
</html>
